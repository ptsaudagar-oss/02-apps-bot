# 🚀 Render Cloud Blueprint: Enterprise Multi-Service Architecture (Phase 4 IaC)
# Document Version: 4.0.0
# Services: enterprise-n8n-middleware, hermes-agent-engine, nine-router-proxy, apps-bot-service
# Database: bot-db-cluster (Managed PostgreSQL with ipAllowList: [])

services:
  # ---------------------------------------------------------------------------
  # 1. n8n Workflow Automation Engine
  # ---------------------------------------------------------------------------
  - type: web
    name: enterprise-n8n-middleware
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: singapore
    disk:
      name: n8n-storage
      mountPath: /home/node/.n8n
      sizeGB: 10
    envVars:
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROTOCOL
        value: "https"
      - key: WEBHOOK_URL
        value: "https://enterprise-n8n-middleware.onrender.com"

  # ---------------------------------------------------------------------------
  # 2. Hermes Cognitive Reasoning & Tripartite Memory Engine
  # ---------------------------------------------------------------------------
  - type: web
    name: hermes-agent-engine
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: singapore
    disk:
      name: hermes-data
      mountPath: /app/hermes/data
      sizeGB: 10
    envVars:
      - key: HERMES_PORT
        value: "8000"
      - key: SKILL_EVOLVER_ENABLED
        value: "true"

  # ---------------------------------------------------------------------------
  # 3. 9Router Token Optimization Proxy (Port 20128)
  # ---------------------------------------------------------------------------
  - type: web
    name: nine-router-proxy
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: singapore
    disk:
      name: router-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: ROUTER_PORT
        value: "20128"
      - key: RTK_TOKEN_SAVER
        value: "true"

  # ---------------------------------------------------------------------------
  # 4. Master Unified Container (FastAPI + WhatsApp + Telegram + Gmail)
  # ---------------------------------------------------------------------------
  - type: web
    name: apps-bot-service
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"
      - key: WHATSAPP_SERVER_PORT
        value: "8080"
      - key: WHATSAPP_SERVER_HOST
        value: "0.0.0.0"
      - key: WHATSAPP_VERIFY_TOKEN
        value: APPS_BOT_WHATSAPP_SECRET_TOKEN
      - key: WHATSAPP_FAILOVER_TO_LOCAL
        value: "true"
      - key: WHATSAPP_LOCAL_GATEWAY_URL
        value: http://127.0.0.1:3000/api/send
      - key: GMAIL_AUTH_MODE
        value: app_password
      - key: GMAIL_CHECK_INTERVAL_SECONDS
        value: "60"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: APM_PROJECT_CODENAME
        value: Antigravity Assistant Production Manager
      - key: APM_ORGANIZATION
        value: PT. Saudagar

  # ---------------------------------------------------------------------------
  # 5. Dedicated Telegram Gmail Bot (Solusi Santai: 24/7 Cloud Engine)
  # ---------------------------------------------------------------------------
  - type: web
    name: telegram-gmail-bot
    env: docker
    dockerfilePath: ./Dockerfile.telegram
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: PRODUCTION_MODE
        value: "true"
      - key: GMAIL_AUTH_MODE
        value: app_password
      - key: GMAIL_CHECK_INTERVAL_SECONDS
        value: "60"
      - key: GMAIL_PRIMARY_ACCOUNT
        value: pt.saudagar@gmail.com
      - key: GMAIL_ECOMMERCE_ACCOUNT
        value: 8m.shop.online@gmail.com
      - key: GMAIL_OWNER_ACCOUNT
        value: kafnun84@gmail.com
      - key: TELEGRAM_AUTHORIZED_CHAT_IDS
        value: "7828326094"
      - key: TELEGRAM_POLLING_INTERVAL
        value: "2"
      - key: ENCLAVE_PII_REDACTION
        value: "true"
      - key: AUTO_TRIGGER_INTERVAL_SECONDS
        value: "60"
      - key: APM_PROJECT_CODENAME
        value: Antigravity Assistant Production Manager
      - key: APM_ORGANIZATION
        value: PT. Saudagar

# -----------------------------------------------------------------------------
# Managed PostgreSQL Database Cluster (Strict Private Network Isolation)
# -----------------------------------------------------------------------------
databases:
  - name: bot-db-cluster
    databaseName: apps_bot_db
    user: apps_bot_admin
    plan: standard
    region: singapore
    ipAllowList: []  # Strict private network isolation: No public internet access

