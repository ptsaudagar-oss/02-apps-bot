# 🚀 Render Cloud Blueprint: 100% FREE TIER (NO CREDIT CARD REQUIRED)
# Document Version: 2.0.0 (Community Free Cloud Architecture)
# Single Unified Container: FastAPI + Telegram Polling + Gmail Watcher + WhatsApp Bot

services:
  # ---------------------------------------------------------------------------
  # Unified Web Service (100% Free Plan - Public HTTPS + SSL Otomatis)
  # ---------------------------------------------------------------------------
  - type: web
    name: apps-bot-service
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8080"
      - key: WHATSAPP_SERVER_PORT
        value: "8080"
      - key: WHATSAPP_SERVER_HOST
        value: "0.0.0.0"
      - key: WHATSAPP_VERIFY_TOKEN
        value: APPS_BOT_WHATSAPP_SECRET_TOKEN
      - key: WHATSAPP_FAILOVER_TO_LOCAL
        value: "true"
      - key: WHATSAPP_LOCAL_GATEWAY_URL
        value: http://127.0.0.1:3000/api/send
      - key: GMAIL_AUTH_MODE
        value: app_password
      - key: GMAIL_CHECK_INTERVAL_SECONDS
        value: "60"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
