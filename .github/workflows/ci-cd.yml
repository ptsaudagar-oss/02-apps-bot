name: "APPS_BOT Sovereign CI/CD Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-control-gate:
    name: "Pre-Deploy Quality Control Gate (100% Passed Required)"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Execute Master CLI QC Suite"
        run: |
          python apps_bot_manager.py test

      - name: "Execute Phase 4 & Phase 5 Audit Verification"
        run: |
          python apps_bot_manager.py audit-phase4
          python apps_bot_manager.py audit-phase5

  deploy-to-koyeb:
    name: "Koyeb Cloud Zero-Downtime Deployment (Singapore Region)"
    needs: quality-control-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: "Trigger Koyeb Production Deployment Signal"
        run: |
          echo "Triggering zero-downtime container deployment on Koyeb Cloud (Singapore Region)..."
          # Koyeb automatically pulls and redeploys upon push to main
          echo "Koyeb Cloud deployment signal dispatched successfully."
